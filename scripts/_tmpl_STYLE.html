  <style>
    .article-hero{padding:140px 24px 80px;max-width:var(--max-w);margin:0 auto;}
    .article-hero .back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-tertiary);text-decoration:none;margin-bottom:48px;transition:var(--transition);}
    .article-hero .back:hover{color:var(--text-primary);}
    .article-hero .tag{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:20px;display:block;}
    .article-hero h1{font-family:var(--font-display);font-size:clamp(36px,5vw,60px);font-weight:700;letter-spacing:-.04em;line-height:1.1;margin-bottom:24px;max-width:880px;}
    .article-hero .byline{font-size:14px;color:var(--text-tertiary);display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
    .hero-img-wrap{width:100%;background:var(--bg-4);border-bottom:1px solid var(--border);}
    .hero-img-wrap img{width:100%;height:auto;display:block;max-width:100%;}
    .article-body{max-width:720px;margin:0 auto;padding:80px 24px 120px;}
    .article-body h2{font-size:28px;font-weight:600;color:var(--text-primary);margin:3.5rem 0 1rem;letter-spacing:-.02em;scroll-margin-top:90px;}
    .article-body h3{font-size:19px;font-weight:500;color:var(--text-primary);margin:2.5rem 0 .6rem;letter-spacing:-.01em;scroll-margin-top:90px;}
    .article-body p{font-size:17px;color:var(--text-secondary);line-height:1.8;margin-bottom:1.2rem;}
    .article-body ul,.article-body ol{padding-left:24px;margin-bottom:1.2rem;}
    .article-body li{font-size:17px;color:var(--text-secondary);line-height:1.8;margin-bottom:6px;}
    .article-body strong{color:var(--text-primary);font-weight:500;}
    .article-divider{border:none;border-top:1px solid var(--border);margin:3.5rem 0;}
    .lead{font-size:21px !important;line-height:1.6 !important;color:var(--text-primary) !important;font-weight:400;margin-bottom:1.6rem !important;}
    sup.cite{font-size:11px;color:var(--accent);font-weight:600;vertical-align:super;}

    .article-body .eq{background:var(--bg-3);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:3px;padding:6px 20px;margin:22px 0;overflow-x:auto;color:var(--text-primary);}

    .callout{border-radius:3px;padding:20px 24px;margin:28px 0;font-size:16px;line-height:1.7;border:1px solid var(--border);background:var(--bg-3);color:var(--text-secondary);border-left:3px solid var(--accent);}
    .callout .lbl{font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:8px;color:var(--accent);}
    .callout strong{color:var(--text-primary);}
    .callout.warn{border-left-color:var(--danger);} .callout.warn .lbl{color:var(--danger);}
    .callout.key{border-left-color:var(--warning);} .callout.key .lbl{color:var(--warning);}
    .callout.green{border-left-color:var(--success);} .callout.green .lbl{color:var(--success);}

    .tbl-wrap{overflow-x:auto;margin:24px 0;}
    .article-body table{width:100%;border-collapse:collapse;font-size:14px;background:var(--bg-3);border-radius:3px;overflow:hidden;border:1px solid var(--border);}
    .article-body caption{caption-side:top;text-align:left;font-size:13px;color:var(--text-tertiary);margin-bottom:10px;}
    .article-body th{background:var(--bg-4);color:var(--text-primary);text-align:left;padding:11px 14px;font-weight:600;font-size:13px;}
    .article-body td{padding:11px 14px;border-top:1px solid var(--border);vertical-align:top;color:var(--text-secondary);line-height:1.6;}
    .article-body td.num,.article-body th.num{text-align:right;font-variant-numeric:tabular-nums;}

    ul.clean li{margin-bottom:9px;}

    .schematic{margin:30px 0;border:1px solid var(--border);border-radius:3px;background:var(--bg-3);padding:22px 20px 10px;box-shadow:var(--shadow-glass);}
    .schematic svg{width:100%;height:auto;display:block;}
    .schematic .cap{font-size:13px;color:var(--text-tertiary);margin-top:12px;text-align:center;line-height:1.5;}

    .fig{margin:30px 0;border:1px solid var(--border);border-radius:3px;overflow:hidden;background:var(--sheet);box-shadow:var(--shadow-glass);}
    .fig-head{padding:18px 22px 6px;}
    .fig-head .ftitle{font-weight:700;font-size:15px;color:var(--air);}
    .fig-head .fsub{font-size:12.5px;color:var(--text-secondary);margin-top:3px;line-height:1.5;}
    .chart-box{position:relative;height:430px;padding:8px 14px 18px;}
    @media(max-width:640px){.chart-box{height:340px;}}
    .controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;padding:10px 22px 22px;border-top:1px solid var(--border);background:var(--bg-2);}
    .ctrl label{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:6px;}
    .ctrl label span{color:var(--air);font-variant-numeric:tabular-nums;}
    .ctrl input[type=range]{width:100%;accent-color:var(--danger);}
    .ctrl .hint{font-size:11.5px;color:var(--text-secondary);margin-top:4px;line-height:1.45;}
    .ctrl select{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:3px;font-size:13px;font-family:inherit;background:var(--sheet);color:var(--text-primary);}
    .readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:0;border-top:1px solid var(--border);}
    .readout .cell{padding:14px 16px;border-right:1px solid var(--border);}
    .readout .cell:last-child{border-right:none;}
    .readout .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-secondary);}
    .readout .v{font-size:22px;font-weight:700;color:var(--air);font-variant-numeric:tabular-nums;margin-top:2px;}
    .readout .v small{font-size:13px;font-weight:500;color:var(--text-secondary);}
    .badge{display:inline-block;padding:3px 10px;border-radius:3px;font-size:12px;font-weight:600;}
    .badge.good{background:var(--success-w);color:var(--success);}
    .badge.warn{background:var(--warning-w);color:var(--warning);}
    .badge.bad{background:var(--danger-w);color:var(--danger);}
    .fig-note{font-size:15px;color:var(--text-tertiary);margin-top:-8px;}

    .article-body ol.refs{counter-reset:ref;list-style:none;padding:0;font-size:14px;}
    .article-body ol.refs li{counter-increment:ref;padding:10px 0 10px 38px;position:relative;border-bottom:1px solid var(--border);color:var(--text-secondary);line-height:1.55;margin-bottom:0;}
    .article-body ol.refs li::before{content:"["counter(ref)"]";position:absolute;left:0;top:10px;color:var(--accent);font-weight:700;}
    .article-body ol.refs em{color:var(--text-tertiary);}
    .breadcrumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-tertiary);margin-bottom:20px;flex-wrap:wrap;}
    .breadcrumb a{color:var(--text-tertiary);text-decoration:none;transition:color .2s;}
    .breadcrumb a:hover{color:var(--text-primary);}
    .breadcrumb-sep{opacity:.4;}
    .breadcrumb-current{color:var(--text-secondary);}
  </style>
